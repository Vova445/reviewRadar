name: D1 production backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
      R2_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install AWS CLI for the R2 S3-compatible API
        run: sudo apt-get update && sudo apt-get install --yes awscli
      - name: Export production D1
        run: npx wrangler d1 export reviewradar-production --remote --skip-confirmation --output /tmp/reviewradar-production.sql
      - name: Calculate row-count manifest and checksum
        run: |
          python3 scripts/count-sqlite-export.py /tmp/reviewradar-production.sql /tmp/reviewradar-production.counts.json
          sha256sum /tmp/reviewradar-production.sql | cut -d ' ' -f 1 > /tmp/reviewradar-production.sql.sha256
      - name: Upload dated backup and manifest to R2
        run: |
          BACKUP_DATE=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          PREFIX="d1/production/${BACKUP_DATE}"
          aws --endpoint-url "$R2_ENDPOINT" s3 cp /tmp/reviewradar-production.sql "s3://${R2_BACKUP_BUCKET}/${PREFIX}.sql" --content-type application/sql
          aws --endpoint-url "$R2_ENDPOINT" s3 cp /tmp/reviewradar-production.counts.json "s3://${R2_BACKUP_BUCKET}/${PREFIX}.counts.json" --content-type application/json
          aws --endpoint-url "$R2_ENDPOINT" s3 cp /tmp/reviewradar-production.sql.sha256 "s3://${R2_BACKUP_BUCKET}/${PREFIX}.sql.sha256" --content-type text/plain
          echo "backup_prefix=${PREFIX}" >> "$GITHUB_OUTPUT"
        id: backup
      - name: Verify uploaded backup size
        run: |
          KEY="${{ steps.backup.outputs.backup_prefix }}.sql"
          SIZE=$(aws --endpoint-url "$R2_ENDPOINT" s3api head-object --bucket "$R2_BACKUP_BUCKET" --key "$KEY" --query ContentLength --output text)
          test "$SIZE" -gt 0
      - name: Remove backup objects older than 30 days
        run: node scripts/rotate-d1-backups.mjs
